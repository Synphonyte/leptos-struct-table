[package]
categories = ["gui", "wasm", "web-programming"]
description = "Generate a complete batteries included leptos data table component from a struct definition."
edition = "2024"
exclude = ["examples/", "tests/"]
keywords = ["data-grid", "data-sheet", "leptos", "table"]
license = "MIT OR Apache-2.0"
name = "leptos-struct-table"
readme = "README.md"
repository = "https://github.com/Synphonyte/leptos-struct-table"
version = "0.20.0"

[package.metadata."docs.rs"]
all-features = true

[dependencies]
chrono = { version = "0.4", optional = true }
jiff = { version = "1", optional = true }
leptos = { version = "0.8" }
leptos-struct-table-macro = { version = "0.15.1" }
leptos-use-element = "0.20"
leptos-use-element-size = "0.20"
leptos-use-event-listener = "0.20"
leptos-use-fn-debounce-throttle = "0.20"
leptos-use-option-local-signal = "0.20"
leptos-use-scroll = "0.20"
rust_decimal = { version = "1", optional = true }
serde = "1"
time = { version = "0.3", optional = true, features = ["formatting"] }
uuid = { version = "1", optional = true, features = [] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DomRect", "Element"] }

[features]
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]
i18n = ["leptos-struct-table-macro/i18n"]
rust_decimal = ["dep:rust_decimal"]
ssr = [
    "leptos-use-element/ssr",
    "leptos-use-element-size/ssr",
    "leptos-use-event-listener/ssr",
    "leptos-use-fn-debounce-throttle/ssr",
    "leptos-use-option-local-signal/ssr",
    "leptos-use-scroll/ssr",
]
time = ["dep:time"]
uuid = ["dep:uuid"]
